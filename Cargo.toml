[workspace]
resolver = "2"
members = ["crates/backslash-core", "crates/backslash"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/backslash-app/backslash"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
