name: Release

# One click: Actions → Release → Run workflow, type the version (e.g. 0.4.0).
# It builds the packages, creates the tag and the GitHub release, publishes the
# AUR package, and brings the version back to main (a pull request it merges).
# Pushing a tag such as v0.4.0 does the same.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.0"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version || github.ref_name }}
        run: |
          v="${INPUT#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::\"$v\" is not a version like 1.2.3"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'workflow_dispatch'
      # The tag points to a commit carrying the new version, so that builds
      # from the tagged source (the AUR) report the right one.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already: building it again"
            exit 0
          fi
          packaging/set-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Version $VERSION" || true
          git tag "$tag"
          git push origin "refs/tags/$tag"

  build:
    needs: version
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ needs.version.outputs.version }}
      # A tag pushed by hand may still carry the previous version.
      - name: Set the version
        run: packaging/set-version.sh "${{ needs.version.outputs.version }}"
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build packages
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          # A release made by hand on GitHub (which pushed the tag) gets the files.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Backslash $VERSION" --generate-notes
          fi

  aur:
    needs: [version, release]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Install git and ssh
        run: pacman -Syu --noconfirm --needed git openssh
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: packaging/aur/publish.sh "${{ needs.version.outputs.version }}"

  # The apt and dnf repositories, published on GitHub Pages. Needs the
  # REPO_SIGNING_KEY secret and Pages set to "GitHub Actions" (CONTRIBUTING.md).
  repos:
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install the repository tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c rpm gnupg
      - name: Build the repositories
        id: build
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          packaging/repo/build.sh dist site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [ -f site/index.html ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.publish == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.build.outputs.publish == 'true'

  # main only takes pull requests, so the new version comes back as one, which
  # the workflow merges itself: GitHub Actions may bypass the review rule for
  # pull requests (Settings → Rules, CONTRIBUTING.md). When it can't, the job
  # fails, so a release never leaves main behind silently.
  bump:
    needs: [version, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Bring the new version to main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          packaging/set-version.sh "$VERSION"
          if git diff --quiet; then
            echo "main already says $VERSION"
            exit 0
          fi
          branch="release/v$VERSION"
          title="chore(release): $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "$title"
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Released as [v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION): the version, the AppStream release list and the AUR checksum on main. Merged by the release workflow." \
              || { echo "::error::Could not open the pull request: allow GitHub Actions to create pull requests (Settings → Actions → General). The branch $branch is pushed."; exit 1; }
          fi
          gh pr merge "$branch" --squash --admin --delete-branch --subject "$title" \
            || { echo "::error::Could not merge the version pull request: add GitHub Actions to the bypass list of main's ruleset, for pull requests only (CONTRIBUTING.md). Merge it by hand meanwhile."; exit 1; }
          echo "main now says $VERSION"
