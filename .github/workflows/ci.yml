name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install GTK and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check
        run: make check

  # The AUR package of the last release, prepared but not published.
  aur:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install git and ssh
        run: pacman -Syu --noconfirm --needed git openssh
      - name: Prepare the AUR package
        run: |
          latest=$(curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
          packaging/aur/publish.sh "$latest"
