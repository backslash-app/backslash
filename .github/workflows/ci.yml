name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install GTK and bubblewrap
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check
        run: make check

  # The real launcher in a virtual display, driven with the keyboard.
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install GTK and a virtual display
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb xdotool xclip dbus
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: UI tests
        run: make ui-test

  # The Nix flake still builds (and runs the core's tests).
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@v31
      - name: Build the flake
        run: nix build .#backslash -L

  # The AUR package of the last release, prepared but not published.
  aur:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install git and ssh
        run: pacman -Syu --noconfirm --needed git openssh
      - name: Prepare the AUR package
        run: |
          # From the tags, not the API, which rate-limits shared runners.
          latest=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's|.*refs/tags/v||' | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::error::No release tag found"; exit 1; }
          packaging/aur/publish.sh "$latest"
