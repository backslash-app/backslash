[extension]
id = "system"
title = "System"
version = "1.1.0"
description = "Power, volume and processes"
author = "Backslash"
icon = "bs-settings"
license = "MIT"
categories = ["system"]

[permissions]
run = ["systemctl", "loginctl", "wpctl", "pactl", "ps", "kill"]

[[commands]]
name = "power"
title = "Power"
description = "Lock, suspend, restart or shut down"
icon = "bs-power"
keywords = ["shutdown", "reboot", "restart", "suspend", "sleep", "lock", "logout"]

[[commands]]
name = "volume"
title = "Set Volume"
icon = "bs-speaker"
keywords = ["sound", "audio", "mute"]
mode = "no-view"
[[commands.arguments]]
name = "level"
placeholder = "0-100"
type = "number"
min = 0
max = 150
required = true

[[commands]]
name = "processes"
title = "Processes"
description = "Find and stop running processes"
icon = "bs-cpu"
keywords = ["kill", "task manager", "top"]
